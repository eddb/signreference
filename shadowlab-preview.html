<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ShadowLab — type preview</title>
<style>
  :root{
    --ink:#0c1a24; --panel:#12222e; --panel-edge:#24414f;
    --text:#dce7ee; --muted:#8aa6b4; --accent:#7fe0e8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{background:var(--ink);color:var(--text);
    font-family:ui-sans-serif,-apple-system,system-ui,"Segoe UI",sans-serif;
    display:flex;flex-direction:column;min-height:100%;}
  header{padding:12px 16px;border-bottom:1px solid var(--panel-edge);
    display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
  header h1{font-size:15px;margin:0;letter-spacing:.06em;text-transform:uppercase;font-weight:700;}
  header span{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:11px;color:var(--muted);}
  main{display:flex;flex:1;min-height:0;flex-wrap:wrap;}
  .stage-wrap{flex:1 1 360px;min-width:300px;position:relative;background:#1f4e6b;}
  canvas{display:block;width:100%;height:100%;touch-action:none;}
  .stage-tag{position:absolute;left:12px;bottom:10px;font-family:ui-monospace,Menlo,monospace;
    font-size:11px;color:rgba(255,255,255,.55);pointer-events:none;}
  aside{flex:0 0 300px;background:var(--panel);border-left:1px solid var(--panel-edge);
    padding:14px 16px 28px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .group{margin-bottom:18px;}
  .group > .label{font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
  .seg{display:flex;gap:6px;}
  .seg button{flex:1;padding:9px 6px;border:1px solid var(--panel-edge);background:transparent;
    color:var(--muted);font-size:12px;border-radius:7px;cursor:pointer;font-weight:600;}
  .seg button.on{background:var(--accent);color:#06222a;border-color:var(--accent);}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0;}
  .row label{font-size:13px;}
  .row .val{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--accent);min-width:46px;text-align:right;}
  input[type=range]{width:100%;accent-color:var(--accent);height:26px;}
  input[type=text]{width:100%;padding:9px 10px;border:1px solid var(--panel-edge);background:#0c1a24;
    color:var(--text);border-radius:7px;font-size:15px;}
  .slider{margin:6px 0 2px;}
  .swatches{display:flex;gap:14px;}
  .swatch{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--muted);}
  .swatch input[type=color]{width:42px;height:30px;border:1px solid var(--panel-edge);border-radius:6px;background:none;padding:0;cursor:pointer;}
  .toggles{display:flex;flex-direction:column;gap:8px;}
  .toggles label{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;}
  .toggles input{width:16px;height:16px;accent-color:var(--accent);}
  .hint{font-size:11px;color:var(--muted);line-height:1.45;margin-top:6px;}
  .disabled{opacity:.35;pointer-events:none;}
</style>
</head>
<body>
<header>
  <h1>ShadowLab</h1>
  <span>type preview · Jost (Futura stand-in) · same engine as the .jsx</span>
</header>
<main>
  <div class="stage-wrap">
    <canvas id="c"></canvas>
    <div class="stage-tag" id="tag">block · 45° · 120</div>
  </div>
  <aside>
    <div class="group">
      <div class="label">Text</div>
      <input type="text" id="textInput" value="SCOTTS" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      <div class="row" style="margin-top:10px;"><label>Size</label><span class="val" id="sizeVal">100%</span></div>
      <input class="slider" type="range" id="size" min="40" max="160" value="100">
    </div>

    <div class="group">
      <div class="label">Mode</div>
      <div class="seg" id="modeSeg">
        <button data-mode="block" class="on">Block</button>
        <button data-mode="point">To point</button>
        <button data-mode="inner">Inner</button>
      </div>
    </div>

    <div class="group" id="angleGroup">
      <div class="row"><label>Angle</label><span class="val" id="angleVal">45°</span></div>
      <input class="slider" type="range" id="angle" min="0" max="360" value="45">
    </div>

    <div class="group">
      <div class="row"><label>Length</label><span class="val" id="lenVal">120</span></div>
      <input class="slider" type="range" id="len" min="0" max="400" value="120">
    </div>

    <div class="group">
      <div class="row"><label>Curve quality</label><span class="val" id="qVal">12</span></div>
      <input class="slider" type="range" id="q" min="2" max="40" value="12">
    </div>

    <div class="group" id="invertGroup">
      <div class="label">Vanishing point</div>
      <div class="toggles"><label><input type="checkbox" id="invert" checked> Cast away from point</label></div>
      <div class="hint">In “To point” mode, drag the ring on the canvas to move the vanishing point.</div>
    </div>

    <div class="group">
      <div class="label">Colours</div>
      <div class="swatches">
        <div class="swatch"><input type="color" id="faceCol" value="#e8889a"><span>Face</span></div>
        <div class="swatch"><input type="color" id="shadowCol" value="#7a1f2b"><span>Shadow</span></div>
        <div class="swatch"><input type="color" id="bgCol" value="#1f4e6b"><span>Stage</span></div>
      </div>
    </div>

    <div class="group">
      <div class="label">Show</div>
      <div class="toggles">
        <label><input type="checkbox" id="showFace" checked> Letter face</label>
        <label><input type="checkbox" id="showOutline"> Original outline</label>
      </div>
    </div>
  </aside>
</main>

        var c2x=c.x+2/3*(c.x1-c.x),     c2y=c.y+2/3*(c.y1-c.y);
        cur.ox=c1x; cur.oy=c1y;
        cur={x:c.x,y:c.y,ix:c2x,iy:c2y,ox:c.x,oy:c.y}; pts.push(cur);
      }
      else if(c.type==='Z'){ flush(); }
    }
    flush();
    return subs;
  }


  function subsBBox(subs){
    var minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
    for(var i=0;i<subs.length;i++){ for(var j=0;j<subs[i].length;j++){
      var p=subs[i][j];
      if(p.x<minx)minx=p.x; if(p.x>maxx)maxx=p.x;
      if(p.y<miny)miny=p.y; if(p.y>maxy)maxy=p.y;
    }}
    return {minx:minx,miny:miny,maxx:maxx,maxy:maxy};
  }
  function translateSubs(subs,dx,dy){
    for(var i=0;i<subs.length;i++){ for(var j=0;j<subs[i].length;j++){
      var p=subs[i][j];
      p.x+=dx;p.y+=dy;p.ix+=dx;p.iy+=dy;p.ox+=dx;p.oy+=dy;
    }}
  }
  // build glyphs stacked vertically, each centred on x=0
  function buildStacked(t){
    var em=100, yStep=86, xStep=48, all=[], x=0, y=0;
    for(var i=0;i<t.length;i++){
      var ch=t.charAt(i);
      if(ch===' '){ x+=xStep; y+=yStep; continue; }
      var p=font.getPath(ch,0,0,em);
      var subs=commandsToSubs(p.commands);
      if(!subs.length){ x+=xStep; y+=yStep; continue; }
      var bb=subsBBox(subs);
      var dx=x-(bb.minx+bb.maxx)/2;
      var dy=y-(bb.miny+bb.maxy)/2;
      translateSubs(subs,dx,dy);
      for(var k=0;k<subs.length;k++) all.push(subs[k]);
      x+=xStep; y+=yStep;
    }
    return all;
  }

  function rebuildText(){
    if(!font){ state.rawSubs=[]; state.bbox=null; return; }
    var t = state.text || '';
    if(!t.length){ state.rawSubs=[]; state.bbox=null; return; }
    var subs = buildStacked(t);
    state.rawSubs=subs;
    state.bbox = subs.length ? subsBBox(subs) : null;
  }

  // transform raw subs to fit + center in the stage at current size
  function fittedShape(){
    var bb=state.bbox; if(!bb) return [];
    var bw=Math.max(1,bb.maxx-bb.minx), bh=Math.max(1,bb.maxy-bb.miny);
    var art=state.art;
    var s = Math.min((art.w*0.62)/bw, (art.h*0.88)/bh) * state.size;
    var bcx=(bb.minx+bb.maxx)/2, bcy=(bb.miny+bb.maxy)/2;
    var tx=art.x+art.w/2, ty=art.y+art.h/2;
    function T(x,y){ return [ tx + (x-bcx)*s, ty + (y-bcy)*s ]; }
    var out=[];
    for(var i=0;i<state.rawSubs.length;i++){
      var src=state.rawSubs[i], dst=[];
      for(var j=0;j<src.length;j++){
        var p=src[j];
        var a=T(p.x,p.y), inh=T(p.ix,p.iy), outh=T(p.ox,p.oy);
        dst.push({x:a[0],y:a[1],ix:inh[0],iy:inh[1],ox:outh[0],oy:outh[1]});
      }
      out.push(dst);
    }
    return out;
  }

  // ---------- flatten / project (identical logic to the .jsx) ----------
  function bez(p0,p1,p2,p3,t){
    var m=1-t,a=m*m*m,b=3*m*m*t,c=3*m*t*t,d=t*t*t;
    return [a*p0[0]+b*p1[0]+c*p2[0]+d*p3[0], a*p0[1]+b*p1[1]+c*p2[1]+d*p3[1]];
  }
  function dist(a,b){var dx=a[0]-b[0],dy=a[1]-b[1];return Math.sqrt(dx*dx+dy*dy);}
  function flatten(sub,quality){
    var n=sub.length,out=[];
    for(var i=0;i<n;i++){
      var a=sub[i], b=sub[(i+1)%n];
      var p0=[a.x,a.y], p1=[a.ox,a.oy], p2=[b.ix,b.iy], p3=[b.x,b.y];
      var isLine=(p1[0]===p0[0]&&p1[1]===p0[1]&&p2[0]===p3[0]&&p2[1]===p3[1]);
      if(isLine){ out.push(p0); }
      else{
        var steps=Math.max(2,Math.round(quality*(1+dist(p0,p3)/200)));
        if(steps>80)steps=80;
        for(var s=0;s<steps;s++) out.push(bez(p0,p1,p2,p3,s/steps));
      }
    }
    return out;
  }
  function projectFromPoint(P,vp,length,invert){
    var dx=P[0]-vp.x, dy=P[1]-vp.y, d=Math.sqrt(dx*dx+dy*dy);
    if(d===0) return [P[0],P[1]];
    var ux=dx/d, uy=dy/d; if(invert){ux=-ux;uy=-uy;}
    return [P[0]+ux*length, P[1]+uy*length];
  }

  function shapePath(shape){
    var path=new Path2D();
    for(var i=0;i<shape.length;i++){
      var sub=shape[i]; if(!sub.length) continue;
      path.moveTo(sub[0].x,sub[0].y);
      for(var j=0;j<sub.length;j++){
        var a=sub[j], b=sub[(j+1)%sub.length];
        path.bezierCurveTo(a.ox,a.oy,b.ix,b.iy,b.x,b.y);
      }
      path.closePath();
    }
    return path;
  }
  function offsetPath(shape,ox,oy,vanish){
    var path=new Path2D();
    for(var i=0;i<shape.length;i++){
      var poly=flatten(shape[i],state.q), m=poly.length;
      for(var k=0;k<m;k++){
        var P=poly[k], Q = vanish ? projectFromPoint(P,state.vp,state.len,state.invert) : [P[0]+ox,P[1]+oy];
        if(k===0) path.moveTo(Q[0],Q[1]); else path.lineTo(Q[0],Q[1]);
      }
      path.closePath();
    }
    return path;
  }
  function drawQuads(shape,ox,oy,vanish){
    for(var i=0;i<shape.length;i++){
      var poly=flatten(shape[i],state.q), m=poly.length;
      for(var k=0;k<m;k++){
        var A=poly[k], B=poly[(k+1)%m], Ap,Bp;
        if(vanish){ Ap=projectFromPoint(A,state.vp,state.len,state.invert); Bp=projectFromPoint(B,state.vp,state.len,state.invert); }
        else { Ap=[A[0]+ox,A[1]+oy]; Bp=[B[0]+ox,B[1]+oy]; }
        ctx.beginPath();
        ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]); ctx.lineTo(Bp[0],Bp[1]); ctx.lineTo(Ap[0],Ap[1]);
        ctx.closePath(); ctx.fill();
      }
    }
  }

  // ---------- render ----------
  function draw(){
    var W=canvas.width,H=canvas.height,dpr=state.dpr;
    ctx.save(); ctx.scale(dpr,dpr);
    var cw=state.cw, ch=state.ch, art=state.art;
    ctx.fillStyle='#0c1a24'; ctx.fillRect(0,0,cw,ch);
    ctx.fillStyle=state.bg; ctx.fillRect(art.x,art.y,art.w,art.h);
    ctx.strokeStyle='rgba(255,255,255,.22)'; ctx.lineWidth=1; ctx.strokeRect(art.x+0.5,art.y+0.5,art.w-1,art.h-1);

    if(fontError){ msg('Font failed to load: '+fontError); ctx.restore(); return; }
    var shape=fittedShape();
    if(!shape.length){ msg('Type something in the Text field.'); ctx.restore(); if(state.mode==='point')drawVP(); return; }

    var face=shapePath(shape);
    var theta=state.angle*Math.PI/180;
    var ox=Math.cos(theta)*state.len, oy=Math.sin(theta)*state.len;
    var vanish=(state.mode==='point');

    if(state.mode==='inner'){
      if(state.showFace){ ctx.fillStyle=state.face; ctx.fill(face); }
      ctx.save(); ctx.clip(face);
      ctx.fillStyle=state.shadow; drawQuads(shape,ox,oy,vanish);
      ctx.restore();
    } else {
      ctx.fillStyle=state.shadow;
      ctx.fill(offsetPath(shape,ox,oy,vanish));
      drawQuads(shape,ox,oy,vanish);
      ctx.fill(face);
      if(state.showFace){ ctx.fillStyle=state.face; ctx.fill(face); }
    }
    if(state.showOutline){ ctx.lineWidth=1.25; ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.stroke(face); }
    if(vanish){ drawVP(); }
    ctx.restore();
  }
  function msg(t){
    ctx.fillStyle='rgba(255,255,255,.6)';
    ctx.font='14px ui-monospace,Menlo,monospace';
    ctx.textAlign='center';
    ctx.fillText(t, state.cw/2, state.ch/2);
    ctx.textAlign='start';
  }
  function drawVP(){
    ctx.save();
    ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(state.vp.x,state.vp.y,9,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(state.vp.x,state.vp.y,2,0,Math.PI*2); ctx.fillStyle='rgba(255,255,255,.9)'; ctx.fill();
    ctx.restore();
  }

  // ---------- layout ----------
  function resize(){
    var wrap=canvas.parentElement, dpr=window.devicePixelRatio||1;
    var cw=wrap.clientWidth, ch=wrap.clientHeight;
    canvas.width=Math.round(cw*dpr); canvas.height=Math.round(ch*dpr);
    state.dpr=dpr; state.cw=cw; state.ch=ch;
    var aspect=35/70, pad=20;
    var w=cw-pad*2, h=ch-pad*2;
    if(w/h>aspect){ w=h*aspect; } else { h=w/aspect; }
    state.art={ w:w, h:h, x:(cw-w)/2, y:(ch-h)/2 };
    state.cx=cw*0.5; state.cy=ch*0.5;
    if(state.vp.x===0&&state.vp.y===0){ state.vp.x=cw*0.5; state.vp.y=state.art.y+state.art.h*0.98; }
    draw();
  }
  window.addEventListener('resize',resize);

  // ---------- controls ----------
  function on(id,ev,fn){ document.getElementById(id).addEventListener(ev,fn); }

  document.getElementById('modeSeg').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b)return;
    state.mode=b.dataset.mode;
    [].forEach.call(this.children,function(x){x.classList.toggle('on',x===b);});
    document.getElementById('angleGroup').classList.toggle('disabled',state.mode==='point');
    document.getElementById('invertGroup').classList.toggle('disabled',state.mode!=='point');
    updateTag(); draw();
  });

  on('textInput','input',function(){ state.text=this.value; rebuildText(); draw(); });
  on('size','input',function(){ state.size=+this.value/100; document.getElementById('sizeVal').textContent=this.value+'%'; draw(); });
  on('angle','input',function(){ state.angle=+this.value; document.getElementById('angleVal').textContent=this.value+'°'; updateTag(); draw(); });
  on('len','input',function(){ state.len=+this.value; document.getElementById('lenVal').textContent=this.value; updateTag(); draw(); });
  on('q','input',function(){ state.q=+this.value; document.getElementById('qVal').textContent=this.value; draw(); });
  on('invert','change',function(){ state.invert=this.checked; draw(); });
  on('faceCol','input',function(){ state.face=this.value; draw(); });
  on('shadowCol','input',function(){ state.shadow=this.value; draw(); });
  on('bgCol','input',function(){ state.bg=this.value; draw(); });
  on('showFace','change',function(){ state.showFace=this.checked; draw(); });
  on('showOutline','change',function(){ state.showOutline=this.checked; draw(); });

  function updateTag(){
    var t=document.getElementById('tag');
    if(state.mode==='point') t.textContent='to point · len '+state.len;
    else t.textContent=state.mode+' · '+state.angle+'° · '+state.len;
  }

  // ---------- drag vanishing point ----------
  var dragging=false;
  function pos(e){ var r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
  canvas.addEventListener('pointerdown',function(e){
    if(state.mode!=='point')return;
    var p=pos(e);
    if(Math.hypot(p.x-state.vp.x,p.y-state.vp.y)<30){ dragging=true; canvas.setPointerCapture(e.pointerId); }
  });
  canvas.addEventListener('pointermove',function(e){ if(!dragging)return; var p=pos(e); state.vp.x=p.x; state.vp.y=p.y; draw(); });
  canvas.addEventListener('pointerup',function(){dragging=false;});
  canvas.addEventListener('pointercancel',function(){dragging=false;});

  // init
  document.getElementById('invertGroup').classList.add('disabled');
  rebuildText();
  resize();
})();
</script>
</body>
</html>
